.heroFallback{width:100%;padding:35px 7%;background:linear-gradient(90deg,#633119,#7f4225);min-height:220px;display:flex;align-items:center}
.hero h1{font:700 clamp(38px,7vw,62px)/1 Georgia,serif;margin:0;color:#fff1d2;text-shadow:0 2px 4px #0008}
.hero p{font:clamp(17px,3vw,25px)/1.2 Georgia,serif;margin:9px 0 0;color:#f6e4c7}
main{max-width:1100px;margin:auto;padding:18px}
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 170px 150px auto;gap:10px;margin-bottom:14px}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);background:#fffdf9;color:var(--ink);border-radius:12px;padding:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c89a5525}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--wood);color:white}.secondary{background:#efe0cf;color:#66351f}.danger{background:#f8e5e1;color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat,.card,.formbox,.modalbox{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 9px 28px #63371912}
.stat{padding:15px}.stat b{display:block;font:700 25px Georgia,serif}.stat span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
.card{padding:17px;display:flex;flex-direction:column;gap:9px;min-height:235px}
.card h3{font:700 20px Georgia,serif;margin:0}.artist{color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#f0e1cf;color:#6b381e;border-radius:99px;padding:5px 9px;font-size:12px}
.stars{color:#b87924;letter-spacing:2px}.note{color:#665548;font-size:14px;line-height:1.4;min-height:38px}
.actions{display:flex;gap:7px;margin-top:auto}.actions button{flex:1;padding:9px}
.empty{text-align:center;padding:50px;color:var(--muted);grid-column:1/-1}
.formbox{padding:18px;margin-bottom:18px;display:none}.formbox.open{display:block}.formbox h2{margin:0 0 14px;font-family:Georgia,serif}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal{position:fixed;inset:0;background:#28170db5;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}
.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px}.modalbox h2{font-family:Georgia,serif}
.row{padding:10px 0;border-bottom:1px solid var(--line)}.row b{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.play{display:inline-block;margin-top:14px;padding:10px 13px;border-radius:11px;background:#efe0cf;color:#63351e;text-decoration:none;font-weight:700}
@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:480px){main{padding:11px}.stats{gap:8px}.stat{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>

<main>
<div class="toolbar">
  <input id="search" class="search" placeholder="🔎 Search songs, singers, films...">
  <select id="genreFilter"><option value="">All genres</option></select>
  <select id="yearFilter"><option value="">All years</option></select>
  <button class="primary" onclick="openForm()">＋ Add Song</button>
</div>
<div class="stats">
  <div class="stat"><b id="count">0</b><span>Songs</span></div>
  <div class="stat"><b id="topCount">0</b><span>5-star songs</span></div>
  <div class="stat"><b id="genreCount">0</b><span>Genres</span></div>
</div>
<section id="form" class="formbox">
<h2 id="formTitle">Add a Song</h2>
<div class="fields">
<div class="field"><label>Song *</label><input id="fSong"></div><div class="field"><label>Genre</label><input id="fGenre"></div>
<div class="field"><label>Singer</label><input id="fSinger"></div><div class="field"><label>Lyricist</label><input id="fLyricist"></div>
<div class="field"><label>Music</label><input id="fMusic"></div><div class="field"><label>Album / Film</label><input id="fAlbum"></div>
<div class="field"><label>Year</label><input id="fYear" type="number" min="1800" max="2100"></div>
<div class="field"><label>Rating</label><select id="fRating"><option value="0">No rating</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div>
<div class="field full"><label>Note</label><textarea id="fNote" rows="3"></textarea></div>
<div class="field full"><label>Music Link (optional)</label><input id="fLink" type="url" placeholder="https://..."></div>
</div>
<div class="form-actions"><button class="secondary" onclick="closeForm()">Cancel</button><button class="primary" onclick="saveSong()">Save Song</button></div>
</section>
<div id="songs" class="grid"></div>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div id="details"></div><button class="secondary" style="width:100%;margin-top:15px" onclick="closeModal()">Close</button></div></div>
<script>
const initialSongs = [{"song": "Baanallu Neene Buviyalli Neene", "genre": "Kannada Film Song", "singer": "S. Janaki", "lyricist": "", "music": "", "album": "Bayaka Daati", "year": "1976", "note": "", "rating": 5, "link": ""}, {"song": "Chalna Hai Dur Musafir", "genre": "Nirupa Begum", "singer": "NA", "lyricist": "Kabir Pad (Sabadi)", "music": "", "album": "NA", "year": "", "note": "", "rating": 5, "link": ""}, {"song": "Pembara Madu Mage", "genre": "Sinhala Film Song", "singer": "Victor Rathnayake", "lyricist": "", "music": "", "album": "Pambara Madu", "year": "1977", "note": "", "rating": 5, "link": ""}, {"song": "So Ja Rajkumari", "genre": "Hindi Film Song", "singer": "K. L. Saigal", "lyricist": "", "music": "", "album": "Tansen", "year": "1940", "note": "", "rating": 5, "link": ""}, {"song": "Maze Maher Pandhari", "genre": "Marathi Abhang", "singer": "Bhimsen Joshi", "lyricist": "", "music": "Traditional", "album": "", "year": "1977", "note": "", "rating": 5, "link": ""}, {"song": "Thaamasamenthe Varuvaan", "genre": "Malayalam Film Song", "singer": "K. J. Yesudas", "lyricist": "", "music": "", "album": "Bhargavi Nilayam", "year": "1964", "note": "", "rating": 5, "link": ""}, {"song": "Unnai Kaanadha Kannum", "genre": "Tamil Film Song", "singer": "P. Susheela", "lyricist": "", "music": "", "album": "Aalayamani", "year": "1973", "note": "", "rating": 5, "link": ""}, {"song": "Moothaval Nee Koduthai", "genre": "Tamil Film Song", "singer": "P. Susheela", "lyricist": "", "music": "", "album": "Aaradhana", "year": "1973", "note": "", "rating": 4, "link": ""}, {"song": "Nilavu Thoongum Neram", "genre": "Tamil Film Song", "singer": "S. Janaki, S. P. Balasubrahmanyam", "lyricist": "", "music": "", "album": "Kunguma Chimil", "year": "1985", "note": "", "rating": 5, "link": ""}, {"song": "Kandeesha Aalaaha", "genre": "Syriac Devotional", "singer": "NA", "lyricist": "", "music": "", "album": "NA", "year": "", "note": "", "rating": 4, "link": ""}];
let songs = JSON.parse(localStorage.getItem("sangeetikaSongs"));
if(!Array.isArray(songs) || songs.length < 10){
  songs = initialSongs.map((s,i)=>({id:1000+i,...s}));
  localStorage.setItem("sangeetikaSongs",JSON.stringify(songs));
}
let editingId=null; const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function store(){localStorage.setItem("sangeetikaSongs",JSON.stringify(songs))}
function clearForm(){["fSong","fGenre","fSinger","fLyricist","fMusic","fAlbum","fYear","fNote","fLink"].forEach(id=>$(id).value="");$("fRating").value="0"}
function openForm(id=null){editingId=id;$("form").classList.add("open");$("formTitle").textContent=id?"Edit Song":"Add a Song";if(id){let s=songs.find(x=>x.id===id);["Song","Genre","Singer","Lyricist","Music","Album","Year","Note","Link"].forEach(k=>{let map={Song:"song",Genre:"genre",Singer:"singer",Lyricist:"lyricist",Music:"music",Album:"album",Year:"year",Note:"note",Link:"link"};$("f"+k).value=s[map[k]]||""});$("fRating").value=s.rating||0}else clearForm();$("fSong").focus()}
function closeForm(){$("form").classList.remove("open");editingId=null}
function saveSong(){let song=$("fSong").value.trim();if(!song){alert("Please enter the song name.");return}let d={song,genre:$("fGenre").value.trim(),singer:$("fSinger").value.trim(),lyricist:$("fLyricist").value.trim(),music:$("fMusic").value.trim(),album:$("fAlbum").value.trim(),year:$("fYear").value,note:$("fNote").value.trim(),rating:+$("fRating").value,link:$("fLink").value.trim()};if(editingId)Object.assign(songs.find(s=>s.id===editingId),d);else songs.unshift({id:Date.now(),...d});store();closeForm();render()}
function del(id){if(confirm("Delete this song from Sangeetika?")){songs=songs.filter(s=>s.id!==id);store();render()}}
function view(id){let s=songs.find(x=>x.id===id);let rows=[["Song",s.song],["Genre",s.genre],["Singer",s.singer],["Lyricist",s.lyricist],["Music",s.music],["Album / Film",s.album],["Year",s.year],["Rating",s.rating?"★".repeat(s.rating):"Not rated"],["Note",s.note]];$("details").innerHTML="<h2>"+esc(s.song)+"</h2>"+rows.filter(r=>r[1]).map(r=>`<div class="row"><b>${esc(r[0])}</b>${esc(r[1])}</div>`).join("")+(s.link?`<a class="play" href="${esc(s.link)}" target="_blank" rel="noopener">▶ Open Music Link</a>`:"");$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open")}
function filters(){let gs=[...new Set(songs.map(s=>s.genre).filter(Boolean))].sort(),ys=[...new Set(songs.map(s=>s.year).filter(Boolean))].sort((a,b)=>b-a),g=$("genreFilter").value,y=$("yearFilter").value;$("genreFilter").innerHTML='<option value="">All genres</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join("");$("yearFilter").innerHTML='<option value="">All years</option>'+ys.map(x=>`<option>${esc(x)}</option>`).join("");if(gs.includes(g))$("genreFilter").value=g;if(ys.includes(y))$("yearFilter").value=y}
function render(){filters();let q=$("search").value.toLowerCase(),g=$("genreFilter").value,y=$("yearFilter").value;let a=songs.filter(s=>(!q||Object.values(s).join(" ").toLowerCase().includes(q))&&(!g||s.genre===g)&&(!y||String(s.year)===y));$("count").textContent=songs.length;$("topCount").textContent=songs.filter(s=>s.rating===5).length;$("genreCount").textContent=new Set(songs.map(s=>s.genre).filter(Boolean)).size;$("songs").innerHTML=a.length?a.map(s=>`<article class="card"><h3>${esc(s.song)}</h3><div class="artist">${esc(s.singer||"Singer not added")}</div><div class="tags">${s.genre?`<span class="tag">${esc(s.genre)}</span>`:""}${s.year?`<span class="tag">${esc(s.year)}</span>`:""}${s.album?`<span class="tag">🎬 ${esc(s.album)}</span>`:""}</div><div class="stars">${s.rating?"★".repeat(s.rating)+"☆".repeat(5-s.rating):"Not rated"}</div><div class="note">${esc(s.note||"No note added.")}</div><div class="actions"><button class="secondary" onclick="view(${s.id})">Details</button><button class="secondary" onclick="openForm(${s.id})">Edit</button><button class="danger" onclick="del(${s.id})">Delete</button></div></article>`).join(""):`<div class="empty"><div style="font-size:45px">🎻</div><h2>${songs.length?"No songs found":"Your Sangeetika is empty"}</h2><p>${songs.length?"Try another search or filter.":"Add your first song."}</p></div>`}
$("search").addEventListener("input",render);$("genreFilter").addEventListener("change",render);$("yearFilter").addEventListener("change",render);
render();
</script>
